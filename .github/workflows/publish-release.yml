name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing project release tag
        type: string
        required: true
        default: v1.0.1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check tagged assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest packages.core.test_invariants
          python scripts/build_release.py --ref "$RELEASE_TAG" --fetch-runtime --output dist
          python scripts/smoke_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  windows:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Start and verify the extracted Windows release
        shell: pwsh
        run: |
          $zip = Get-Item assets/*-Windows-x64-Portable.zip
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/release runner"
          $app = "$env:RUNNER_TEMP/release runner/SiliconLifeState"
          & "$app/runtime/python.exe" -I "$app/tests/windows_portable_smoke.py"
          exit $LASTEXITCODE
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Publish tested assets to the invoking repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd assets
          sha256sum -c SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt TEST-REPORT.md README.md --verify-tag --title "Silicon Life State $RELEASE_TAG" --generate-notes
